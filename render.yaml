services:
  - type: web
    name: automl-data-curator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn monitoring.app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DISABLE_SENTENCE_TRANSFORMERS
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
